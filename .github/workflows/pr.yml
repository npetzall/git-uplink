name: PR

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed scopes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      product: ${{ steps.scopes.outputs.product }}
      site: ${{ steps.scopes.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: HEAD^1 is the base branch.
          fetch-depth: 2
      - name: Check scope rules
        run: bash .github/changed-scopes.sh --self-check
      - name: Find changed scopes
        id: scopes
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --name-only HEAD^1 HEAD \
            | bash .github/changed-scopes.sh | tee -a "$GITHUB_OUTPUT"

  version:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    uses: $/.github/workflows/version.yml
    permissions:
      contents: read

  product:
    name: "Product version: ${{ needs.version.outputs.next_version }}-pr.${{ github.event.pull_request.number }}.${{ github.run_id }}.${{ github.run_attempt }}"
    needs: version
    uses: $/.github/workflows/product.yml
    with:
      version: ${{ needs.version.outputs.next_version }}-pr.${{ github.event.pull_request.number }}.${{ github.run_id }}.${{ github.run_attempt }}
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
      issues: write
      pull-requests: write

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: $/.github/workflows/site.yml
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
      issues: write
      pull-requests: write

  # Always runs, so a failure shows as a failed check and not a skipped one.
  # A skipped scope is fine; a failed or cancelled job is not.
  merge-gate:
    name: Merge gate
    needs: [changes, version, product, site]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ok to merge
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "changes: $CHANGES, all: $RESULTS"
          if [[ "$CHANGES" != "success" ]]; then
            echo "could not determine the changed scopes" >&2
            exit 1
          fi
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled" >&2
              exit 1
              ;;
          esac
          echo "OK to merge"
