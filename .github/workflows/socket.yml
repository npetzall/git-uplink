name: socket-security-workflow
run-name: Socket Security Github Action

on:
  workflow_call:
    secrets:
      SOCKET_SECURITY_API_KEY:
        required: false
  schedule:
    - cron: "27 3 * * 1"

permissions: {}

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # For PRs, fetch one additional commit for proper diff analysis
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      # No cache: this job holds secrets. The Socket CLI and every dependency
      # come from .github/socket/uv.lock, with hashes, through sfw.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: v1.16.0
          job-summary: errors

      - name: Run Socket Security Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || 0 }}
        run: |
          PR_NUMBER=$EVENT_NUMBER
          sfw uv run --locked --project .github/socket socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number "$PR_NUMBER" \
            --strict-blocking
