name: Release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - web/**
      - templates/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - Cross.toml
      - rust-toolchain.toml
      - scripts/install.sh
      - .github/calculate-version.sh
      - .github/workflows/release.yml
      - .github/workflows/product.yml
      - .github/workflows/version.yml
      - .github/workflows/codeql.yml
      - .github/workflows/zizmor.yml
      - .github/workflows/actionlint.yml
      - .github/actionlint.yaml
      - .github/actionlint-sarif.tpl
      - .github/workflows/socket.yml
      - .github/socket/**
      - .github/codeql/web.yml
      - .github/codeql/templates.yml
      - .github/codeql/github-scripts.yml

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    uses: $/.github/workflows/version.yml
    permissions:
      contents: read

  product:
    name: "Product version: ${{ needs.version.outputs.next_version }}"
    needs: version
    uses: $/.github/workflows/product.yml
    with:
      all-targets: true
      version: ${{ needs.version.outputs.next_version }}
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
      issues: write
      pull-requests: write

  publish:
    needs: [version, product]
    if: |
      !cancelled() &&
      needs.version.result == 'success' &&
      needs.product.result == 'success' &&
      needs.version.outputs.next_version != needs.version.outputs.current_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Stage and sign the assets
        env:
          CURRENT_VERSION: ${{ needs.version.outputs.current_version }}
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}
          NEXT_VERSION: ${{ needs.version.outputs.next_version }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$NEXT_VERSION" | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { found=1 } END { exit !found }'; then
            echo "invalid version: $NEXT_VERSION" >&2
            exit 1
          fi
          if [[ "$NEXT_TAG" != "v${NEXT_VERSION}" ]]; then
            echo "invalid tag: $NEXT_TAG" >&2
            exit 1
          fi
          # Releases are immutable: assets of a published release cannot be replaced.
          if [[ "$NEXT_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "refusing to republish $NEXT_TAG" >&2
            exit 1
          fi
          mkdir -p staged
          cp binaries/git-uplink-* staged/
          (
            cd staged
            sha256sum git-uplink-* > SHA256SUMS
          )
          cp sbom/git-uplink.cdx.json "staged/git-uplink-${NEXT_VERSION}.cdx.json"
          cp sbom/git-uplink.spdx.json "staged/git-uplink-${NEXT_VERSION}.spdx.json"
          # The bootstrap of ~/.uplink; signed below so it can be verified before it runs.
          install -m 755 scripts/install.sh staged/install.sh
          for f in staged/*; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json" --yes
          done
      # SHA256SUMS lists exactly the binaries. Provenance says this workflow
      # built them from this commit; the SBOM attestation binds the SPDX SBOM
      # to them. `gh attestation verify` checks both.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: staged/SHA256SUMS
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: staged/SHA256SUMS
          sbom-path: sbom/git-uplink.spdx.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}
        run: |
          set -euo pipefail
          # Attach every asset to a draft, then publish; publishing locks the tag and assets.
          gh release create "$NEXT_TAG" staged/* \
            --draft \
            --target "$GITHUB_SHA" \
            --generate-notes
          gh release edit "$NEXT_TAG" --draft=false
