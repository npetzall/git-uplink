name: SBOM

on:
  push:
  pull_request:
  release:
    types: [published]

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
        with:
          syft-version: v1.52.0
      - name: Generate CycloneDX and SPDX SBOMs
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          "$SYFT_CMD" dir:. --source-version "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          if-no-files-found: error
          path: |
            git-uplink.cdx.json
            git-uplink.spdx.json

  attach:
    if: github.event_name == 'release'
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - name: Attach SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cp git-uplink.cdx.json "git-uplink-${tag}.cdx.json"
          cp git-uplink.spdx.json "git-uplink-${tag}.spdx.json"
          gh release upload "$tag" "git-uplink-${tag}.cdx.json" "git-uplink-${tag}.spdx.json" --clobber
