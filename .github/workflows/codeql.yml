name: CodeQL

on:
  workflow_call:
    inputs:
      scope:
        description: product, site, or all
        type: string
        required: true
  schedule:
    - cron: "27 3 * * 1"

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          SCOPE: ${{ github.event_name == 'schedule' && 'all' || inputs.scope }}
        run: |
          set -euo pipefail
          web='{"name":"javascript-typescript-web","language":"javascript-typescript","build-mode":"none","config":"./.github/codeql/web.yml","category":"/language:javascript-typescript-web"}'
          site='{"name":"javascript-typescript-site","language":"javascript-typescript","build-mode":"none","config":"./.github/codeql/site.yml","category":"/language:javascript-typescript-site"}'
          rust='{"name":"rust","language":"rust","build-mode":"none","config":"","category":"/language:rust"}'
          python='{"name":"python-templates","language":"python","build-mode":"none","config":"./.github/codeql/templates.yml","category":"/language:python-templates"}'
          scripts='{"name":"python-github-scripts","language":"python","build-mode":"none","config":"./.github/codeql/github-scripts.yml","category":"/language:python-github-scripts"}'
          case "$SCOPE" in
            product)
              echo "matrix=[$web,$rust,$python,$scripts]" >>"$GITHUB_OUTPUT"
              ;;
            site)
              echo "matrix=[$site]" >>"$GITHUB_OUTPUT"
              ;;
            all)
              echo "matrix=[$web,$site,$rust,$python,$scripts]" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown scope: $SCOPE" >&2
              exit 1
              ;;
          esac

  analyze:
    name: Analyze (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: matrix.language == 'rust'
        with:
          toolchain: 1.98.1

      - name: Initialize CodeQL
        if: matrix.config != ''
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config }}

      - name: Initialize CodeQL
        if: matrix.config == ''
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: ${{ matrix.category }}
