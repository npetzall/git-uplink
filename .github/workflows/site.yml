name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site.yml
      - .github/workflows/zizmor.yml
      - .github/codeql/site.yml
  pull_request:
    paths:
      - site/**
      - .github/workflows/site.yml
      - .github/workflows/zizmor.yml
      - .github/codeql/site.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          job-summary: errors
      - run: sfw npm audit --package-lock-only
      - run: sfw npm ci
      - run: sfw npm run typecheck
      - run: sfw npm test

  codeql:
    uses: $/.github/workflows/codeql.yml
    with:
      scope: site
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

  zizmor:
    uses: $/.github/workflows/zizmor.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  build:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          job-summary: errors
      - run: sfw npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main'
        id: pages
      - name: Build
        run: sfw npm run build
        env:
          PAGES_BASE: ${{ github.ref == 'refs/heads/main' && steps.pages.outputs.base_path || '' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, codeql, zizmor]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
