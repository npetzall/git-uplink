name: Site

on:
  workflow_call:
    inputs:
      pages:
        description: Build for GitHub Pages and upload the Pages artifact
        type: boolean
        default: false
    secrets:
      SOCKET_SECURITY_API_KEY:
        required: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          job-summary: errors
      - run: sfw npm audit --package-lock-only
      - run: sfw npm ci
      - run: sfw npm run typecheck
      - run: sfw npm test

  codeql:
    uses: $/.github/workflows/codeql.yml
    with:
      scope: site
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

  socket:
    uses: $/.github/workflows/socket.yml
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    permissions:
      issues: write
      contents: read
      pull-requests: write

  zizmor:
    uses: $/.github/workflows/zizmor.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  build:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          job-summary: errors
      - run: sfw npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: inputs.pages
        id: pages
      - name: Build
        run: sfw npm run build
        env:
          PAGES_BASE: ${{ inputs.pages && steps.pages.outputs.base_path || '' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.pages
        with:
          path: site/dist
