version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      site-npm:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      web-npm:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust-crates:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/templates/github/.github/actions/install-git-uplink"
      - "/templates/github/.github/actions/uplink-assessment-hook"
      - "/templates/github/.github/actions/uplink-toolchain-hook"
      - "/templates/github/.github/workflows"
      - "/templates/github-hooks/.github/actions/uplink-toolchain-hook"
      - "/templates/github-hooks/.github/workflows"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
