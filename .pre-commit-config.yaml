ci:
  autofix_prs: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: sfw cargo fmt --all
        language: system
        pass_filenames: false
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: sfw cargo clippy --locked --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
      # Rewrites docs/cli.md from the help text; stage the result and commit again.
      - id: cli-docs
        name: generate docs/cli.md
        entry: env UPLINK_BLESS=1 sfw cargo test --locked --test cli_docs
        language: system
        pass_filenames: false
        files: ^(src/cli\.rs|docs/cli\.md|tests/cli_docs\.rs)$
      - id: cargo-deny
        name: cargo deny
        entry: sfw cargo deny check
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|deny\.toml)$
  # Check only, never rewrite: lint without fixes, format with --check.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--no-fix]
      - id: ruff-format
        args: [--check]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
