[package]
name = "git-uplink"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Git subcommand that carries internal patches on public upstream and contributes through an upstream-owned private fork."
license = "MIT"
keywords = ["git", "subcommand", "emu", "oss", "contribution"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-uplink"
path = "src/main.rs"

[lib]
name = "git_uplink"
path = "src/lib.rs"

[lints.rust]
warnings = "deny"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
regex = "=1.13.1"
rust-embed = "=8.11.0"
rust-embed-impl = "=8.12.0"
rust-embed-utils = "=8.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "=1.26.1", features = ["v4"] }
mime_guess = "=2.0.5"
axum = { version = "=0.8.9", features = ["json"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
