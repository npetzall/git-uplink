# CONTRIBUTION / IP gate. Dispatch from company main with a patch id.
# Packet job commits the report. Submit job waits on Environment `oss`.
name: Uplink submit

on:
  workflow_dispatch:
    inputs:
      patch_id:
        description: Patch id to export (upl_…)
        required: true

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  packet:
    name: Write OSS packet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write approver packet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git uplink report ${{ inputs.patch_id }}
      - name: Commit packet on company main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .uplink/reports/${{ inputs.patch_id }}/prepare.md
          git diff --cached --quiet || git commit -m "uplink: OSS packet ${{ inputs.patch_id }}"
          git push origin HEAD:main

  submit:
    name: Approve oss environment and submit
    needs: packet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: oss
      url: ${{ github.server_url }}/${{ github.repository }}/blob/main/.uplink/reports/${{ inputs.patch_id }}/prepare.md
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Mint GitHub App token for public github.com
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPLINK_APP_ID }}
          private-key: ${{ secrets.UPLINK_APP_PRIVATE_KEY }}
          owner: ${{ secrets.UPLINK_UPSTREAM_OWNER }}
          repositories: ${{ secrets.UPLINK_CONTRIB_REPO }}
      - name: Record approval, approve, and submit
        env:
          UPLINK_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLINK_PREFLIGHT: ${{ vars.UPLINK_PREFLIGHT }}
          UPLINK_OSS_ENVIRONMENT: oss
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git uplink approve ${{ inputs.patch_id }}
          git uplink submit ${{ inputs.patch_id }}
          git push origin HEAD:main --force-with-lease
          git push origin "uplink/${{ inputs.patch_id }}" --force
