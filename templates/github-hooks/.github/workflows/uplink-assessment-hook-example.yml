# Starter assessment hook. Callers only run
# .github/workflows/uplink-assessment-hook.yml, so this file is ignored until
# you copy it there. See assessment-hook.md on this branch.
name: Uplink assessment hook
run-name: Uplink assessment hook ${{ inputs.pr }} ${{ inputs.patch }} ${{ inputs.caller_run_id }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Internal pull request number
        required: false
        type: string
      patch:
        description: Patch id (upl_…)
        required: false
        type: string
      state:
        description: Commit of uplink/state to read the patch from (set with patch)
        required: false
        type: string
      caller_run_id:
        description: Caller run id (used to match this hook run)
        required: true
        type: string

permissions:
  contents: read

jobs:
  extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write company extras
        env:
          PR: ${{ inputs.pr }}
          PATCH: ${{ inputs.patch }}
          # With patch: .uplink/patches/<patch>.patch at this uplink/state commit.
          STATE: ${{ inputs.state }}
        run: |
          set -euo pipefail
          mkdir -p extras
          subject=${PATCH:-PR #${PR}}
          cat > extras/10-company.md <<EOF
          ## Company review notes

          Extra details for ${subject}. Replace this step with Jira,
          license, or classification output.
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uplink-packet-extra
          path: extras/*.md
          if-no-files-found: error
