# Company toolchain hook. Replace these steps with what UPLINK_PREFLIGHT
# needs on the runner. See toolchain-hook.md on this branch.
name: Uplink toolchain hook
description: >-
  Set up the build and test toolchain for Uplink preflight. This stub only
  prints toolchain-hook.md to the job summary.
runs:
  using: composite
  steps:
    - name: Show the toolchain hook guide
      shell: bash
      env:
        GUIDE: ${{ github.action_path }}/../../../toolchain-hook.md
      run: cat "$GUIDE" >> "$GITHUB_STEP_SUMMARY"
