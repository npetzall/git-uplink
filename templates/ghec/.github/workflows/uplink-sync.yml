# ghec forge pack (`git uplink init --forge ghec`).
# Requires `git-uplink` on PATH.
# Empty UPLINK_*_AUTH defaults to app.
#
# Inspect fetches public upstream without moving uplink/upstream. Flowed-back
# patches (trailer / patch-id) apply immediately. Foreign commits write
# .uplink/reports/from-upstream/incoming.md and wait on Environment
# `from-upstream`. After approval, accept-upstream promotes uplink/upstream
# and rebuilds company main. Queue history lives on uplink/state (FF-only).
# On apply failure it records the patch as conflict on uplink/state,
# pushes uplink/conflict/<id> (protected base) and <id>-work, and opens
# a gated PR. Do not push the protected base directly.
name: Uplink sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: uplink-sync
  cancel-in-progress: false

permissions: {}

jobs:
  inspect:
    name: Inspect upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    outputs:
      needs_approval: ${{ steps.sync.outputs.needs_approval }}
    steps:
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ secrets.UPLINK_UPSTREAM_OWNER }}
          repositories: ${{ secrets.UPLINK_UPSTREAM_REPO }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}

      - name: Sync with upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
        run: |
          git uplink init
          main_before=$(git rev-parse HEAD)

          set +e
          sync_json=$(git uplink sync)
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

          needs_approval=$(jq -r '.needsApproval // false' <<<"$sync_json")
          echo "needs_approval=${needs_approval}" >> "$GITHUB_OUTPUT"

          git push origin uplink/state
          if [ "$needs_approval" = "true" ]; then
            exit 0
          fi

          git push origin uplink/upstream --force || true

          main_after=$(git rev-parse HEAD)
          if [ "$main_after" != "$main_before" ]; then
            git push origin HEAD:main --force-with-lease
          fi

          if [ "$code" -ne 2 ]; then
            exit 0
          fi

          conflict_id=$(jq -r '.conflict.id // empty' <<<"$sync_json")
          conflict_branch=$(jq -r '.conflict.branch // empty' <<<"$sync_json")
          work_branch=$(jq -r '.conflict.workBranch // empty' <<<"$sync_json")
          if [ -z "$conflict_id" ] || [ "$conflict_id" = "null" ]; then
            echo "sync exited 2 but no conflict patch was recorded"
            exit 2
          fi
          if git show-ref --verify --quiet "refs/heads/${conflict_branch}"; then
            git push origin "refs/heads/${conflict_branch}:refs/heads/${conflict_branch}" --force
          fi
          if [ -n "$work_branch" ] && git show-ref --verify --quiet "refs/heads/${work_branch}"; then
            git push origin "refs/heads/${work_branch}:refs/heads/${work_branch}" --force
          fi

          title=$(jq -r '.gh.prCreate.title' <<<"$sync_json")
          body_file=$(jq -r '.gh.prCreate.bodyFile' <<<"$sync_json")
          head=$(jq -r '.gh.prCreate.head' <<<"$sync_json")
          base=$(jq -r '.gh.prCreate.base' <<<"$sync_json")
          existing=$(gh pr list --head "$head" --base "$base" --state open --json url --jq '.[0].url')
          if [ -z "$existing" ]; then
            gh label create uplink:conflict --description "Uplink sync conflict; resolve via the gated work PR" --color B60205 || true
            url=$(gh pr create --title "$title" --base "$base" --head "$head" --label uplink:conflict --body-file "$body_file")
          else
            url="$existing"
          fi
          git uplink gated "$conflict_id" --pr-url "$url"
          exit 2

  apply:
    name: Approve from-upstream environment and apply
    needs: inspect
    if: needs.inspect.outputs.needs_approval == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      deployments: write
    environment:
      name: from-upstream
      url: ${{ github.server_url }}/${{ github.repository }}/blob/uplink/state/.uplink/reports/from-upstream/incoming.md
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    steps:
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ secrets.UPLINK_UPSTREAM_OWNER }}
          repositories: ${{ secrets.UPLINK_UPSTREAM_REPO }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}

      - name: Accept pending upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
          UPLINK_FROM_UPSTREAM_ENVIRONMENT: from-upstream
        run: |
          git uplink init
          main_before=$(git rev-parse HEAD)

          set +e
          sync_json=$(git uplink accept-upstream)
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

          git push origin uplink/state
          git push origin uplink/upstream --force || true

          main_after=$(git rev-parse HEAD)
          if [ "$main_after" != "$main_before" ]; then
            git push origin HEAD:main --force-with-lease
          fi

          if [ "$code" -ne 2 ]; then
            exit 0
          fi

          conflict_id=$(jq -r '.conflict.id // empty' <<<"$sync_json")
          conflict_branch=$(jq -r '.conflict.branch // empty' <<<"$sync_json")
          work_branch=$(jq -r '.conflict.workBranch // empty' <<<"$sync_json")
          if [ -z "$conflict_id" ] || [ "$conflict_id" = "null" ]; then
            echo "accept-upstream exited 2 but no conflict patch was recorded"
            exit 2
          fi
          if git show-ref --verify --quiet "refs/heads/${conflict_branch}"; then
            git push origin "refs/heads/${conflict_branch}:refs/heads/${conflict_branch}" --force
          fi
          if [ -n "$work_branch" ] && git show-ref --verify --quiet "refs/heads/${work_branch}"; then
            git push origin "refs/heads/${work_branch}:refs/heads/${work_branch}" --force
          fi

          title=$(jq -r '.gh.prCreate.title' <<<"$sync_json")
          body_file=$(jq -r '.gh.prCreate.bodyFile' <<<"$sync_json")
          head=$(jq -r '.gh.prCreate.head' <<<"$sync_json")
          base=$(jq -r '.gh.prCreate.base' <<<"$sync_json")
          existing=$(gh pr list --head "$head" --base "$base" --state open --json url --jq '.[0].url')
          if [ -z "$existing" ]; then
            gh label create uplink:conflict --description "Uplink sync conflict; resolve via the gated work PR" --color B60205 || true
            url=$(gh pr create --title "$title" --base "$base" --head "$head" --label uplink:conflict --body-file "$body_file")
          else
            url="$existing"
          fi
          git uplink gated "$conflict_id" --pr-url "$url"
          exit 2
