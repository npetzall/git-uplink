# ghec forge pack (`git uplink init --forge ghec`).
#
# Runs on every internal PR against company main, BEFORE import.
# Applies the PR's unique diff onto public upstream (+ declared
# Uplink-Depends-On patches) and onto tooling + queued upstream (internal
# omitted), then runs UPLINK_PREFLIGHT (build/test). Skipped for
# uplink:internal-only. Fail the check instead of opening a contribution
# later that is missing queued work the author used from company main.
#
# Put this check in the required status checks for the PR.
name: Uplink export preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: uplink-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preflight:
    if: github.event.pull_request.base.ref == 'main' && !contains(join(github.event.pull_request.labels.*.name, ','), 'uplink:internal-only')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Export preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLINK_PREFLIGHT: ${{ vars.UPLINK_PREFLIGHT }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INTERNAL_ONLY: ${{ contains(github.event.pull_request.labels.*.name, 'uplink:internal-only') }}
        run: |
          git uplink init
          extra=""
          if [ "$INTERNAL_ONLY" = "true" ]; then extra="--internal-only"; fi
          {
            printf '%s\n\n' "$TITLE"
            printf '%s\n' "${BODY:-}"
          } > /tmp/uplink-msg.txt
          set +e
          git uplink preflight \
            --title "$TITLE" \
            --message-file /tmp/uplink-msg.txt \
            --from "$FROM_SHA" \
            --head "$HEAD_SHA" \
            $extra > /tmp/uplink-preflight.md
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/uplink-preflight.md
            exit "$code"
          fi
