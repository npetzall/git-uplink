# CONTRIBUTION / IP gate. Dispatch from company main with a patch id.
# Packet job commits the report on uplink/state. Submit job waits on
# Environment `to-upstream`. Resolve of an already-submitted patch dispatches
# this workflow so IP can approve the delta.
#
# Empty UPLINK_*_AUTH defaults to app.
name: Uplink submit
run-name: Uplink submit ${{ inputs.patch_id }}

on:
  workflow_dispatch:
    inputs:
      patch_id:
        description: Patch id to export (upl_…)
        required: true

permissions: {}

jobs:
  packet:
    name: Write contribution packet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Write approver packet
        env:
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          PATCH_ID: ${{ inputs.patch_id }}
        run: |
          git uplink init
          git uplink report "$PATCH_ID"
          git push origin uplink/state

  submit:
    name: Approve to-upstream environment and submit
    needs: packet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    environment:
      name: to-upstream
      url: ${{ github.server_url }}/${{ github.repository }}/blob/uplink/state/.uplink/reports/${{ inputs.patch_id }}/prepare.md
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Mint contrib GitHub App token
        id: contrib-app
        if: ${{ vars.UPLINK_CONTRIB_AUTH != 'pat' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.UPLINK_CONTRIB_APP_ID }}
          private-key: ${{ secrets.UPLINK_CONTRIB_APP_PRIVATE_KEY }}
          owner: ${{ secrets.UPLINK_UPSTREAM_OWNER }}
          repositories: ${{ secrets.UPLINK_CONTRIB_REPO }}
          permission-contents: write
          permission-pull-requests: write

      - name: Record approval, export, and record the public PR
        env:
          GH_TOKEN: ${{ steps.contrib-app.outputs.token || secrets.UPLINK_CONTRIB_TOKEN }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_CONTRIB_TOKEN: ${{ steps.contrib-app.outputs.token || secrets.UPLINK_CONTRIB_TOKEN }}
          UPLINK_PREFLIGHT: ${{ vars.UPLINK_PREFLIGHT }}
          UPLINK_TO_UPSTREAM_ENVIRONMENT: to-upstream
          PATCH_ID: ${{ inputs.patch_id }}
        run: |
          git uplink init
          git uplink approve "$PATCH_ID"
          submit_json=$(git uplink submit "$PATCH_ID")

          repo=$(jq -r '.gh.prCreate.repo // empty' <<<"$submit_json")
          head=$(jq -r '.gh.prCreate.head // empty' <<<"$submit_json")
          url=$(jq -r '.existingPr.url // empty' <<<"$submit_json")
          if [ -z "$url" ] && [ -n "$repo" ] && [ -n "$head" ]; then
            url=$(gh pr list -R "$repo" --head "$head" --state open --json url --jq '.[0].url')
          fi
          if [ -z "$url" ]; then
            url=$(gh pr create -R "$repo" \
              --head "$head" \
              --base "$(jq -r .gh.prCreate.base <<<"$submit_json")" \
              --title "$(jq -r .gh.prCreate.title <<<"$submit_json")" \
              --body-file "$(jq -r .gh.prCreate.bodyFile <<<"$submit_json")")
          fi
          git uplink submitted "$PATCH_ID" --pr-url "$url"
