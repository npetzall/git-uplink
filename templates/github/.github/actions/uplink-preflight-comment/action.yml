name: Uplink preflight comment
description: >-
  Write the preflight verdict to the pull request: one comment per PR, created
  on the first run and updated in place on every run after, whatever the
  outcome. Runs in a job that never runs preflight.sh.
inputs:
  report:
    description: Output of git uplink preflight --json (the verdict, the end of the output, and the run whose log has all of it). Empty when the preflight job printed none.
    required: true
  pr-number:
    description: Number of the pull request to comment on.
    required: true
  token:
    description: Token with pull-requests write on this repository. Workflows pass secrets.GITHUB_TOKEN.
    required: true
runs:
  using: composite
  steps:
    - name: Comment the preflight result
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPORT: ${{ inputs.report }}
      run: |
        set -euo pipefail
        marker='<!-- uplink:preflight -->'
        body="$RUNNER_TEMP/uplink-preflight-comment.md"
        {
          echo "$marker"
          # The report holds the verdict, the end of the output and the run
          # whose log has all of it; the words are this action's.
          if jq -e 'type == "object"' >/dev/null 2>&1 <<<"$REPORT"; then
            jq -r --arg runs "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/" '
              def fenced($text):
                ("`" * ([([$text | scan("`+") | length] | max // 0), 2] | max + 1)) as $fence
                | "\($fence)\n\($text)\n\($fence)\n";
              def tested:
                if (.tested // []) == [] then empty
                else "\(if .token == null then "Tried to apply:" else "Ran on:" end)\n\n\(.tested | map("- \(.)") | join("\n"))\n"
                end;
              if .ok == true then
                "Uplink preflight passed.\n", tested
              else if .stage == null or .stage == "error" then
                (.message // "Uplink preflight failed.")
              else
                "Uplink preflight failed (\(.stage)). This change is not ready to import or to open an upstream PR.\n",
                (.message // empty),
                "",
                (if .output then fenced(.output) else empty end),
                (if .runId then "Full output: [job log](\($runs)\(.runId))\n" else empty end),
                "Company `main` already includes other queued patches. Branching from it is not enough — record the patches this source actually needs, then retry. Add to the PR body below the cutoff (one per line) and import again:\n",
                fenced(if (.suggestedDependsOn // []) == [] then "Uplink-Depends-On: upl_…"
                  else .suggestedDependsOn | map("Uplink-Depends-On: \(.)") | join("\n") end),
                tested
              end end
            ' <<<"$REPORT"
          else
            echo "Uplink preflight printed no result; see the job log."
          fi
          echo
          echo "[Run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
        } > "$body"
        id=$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
          | head -n 1)
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/${GH_REPO}/issues/comments/${id}" \
            -F "body=@${body}" > /dev/null
        else
          gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            -F "body=@${body}" > /dev/null
        fi
