# GitHub forge pack (`git uplink init --forge github`).
# Required check on PRs into protected uplink bases. These PRs are not imports.
# YAML is loaded from the default branch so *-work cannot replace this sidecar.
# Origin fetch uses the Actions token as UPLINK_INTERNAL_TOKEN (contents: read).
# The shell git fetch of the protected base uses that token for one command.
# The step that assesses and runs preflight.sh has no token: the script
# builds and runs the gated tree. When it ran preflight.sh, a separate job
# writes the verdict to one PR comment, on every run and updated in place.
# On an upstream amend or a transfer to upstream that passed, another job
# runs the company assessment hook on the assessment package (kind `pr`)
# and writes both to the assessment comment, as Uplink PR checks do. That
# job holds actions and pull-requests write and never runs preflight.sh.
name: Uplink gate

on: # zizmor: ignore[dangerous-triggers] YAML from default branch; gated tree is data; contents: read; persist-credentials: false
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - "uplink/conflict/**"
      - "uplink/transfer-to-upstream/**"
      - "uplink/transfer-to-internal/**"
      - "uplink/amend/**"

concurrency:
  group: uplink-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Uplink gate
    if: ${{ !endsWith(github.event.pull_request.base.ref, '-work') }}
    runs-on: ubuntu-latest
    outputs:
      preflight: ${{ steps.run.outputs.preflight }}
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          signer: ${{ vars.UPLINK_SIGNER }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the base and check the changed files
        env:
          UPLINK_INTERNAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git uplink init
          # Depth 2 keeps the base's parent: an amend assesses from it.
          auth=$(printf 'x-access-token:%s' "$UPLINK_INTERNAL_TOKEN" | base64 -w0)
          git \
            -c "http.${GITHUB_SERVER_URL}/.extraheader=" \
            -c "http.${GITHUB_SERVER_URL}/.extraheader=Authorization: Basic ${auth}" \
            fetch origin "$BASE_REF" --depth=2
          if git diff --name-only "$FROM_SHA" "$HEAD_SHA" | grep -E \
            -q '^(\.github/workflows/uplink-.*\.yml|\.github/actions/(install-git-uplink|uplink-[^/]*)/|\.github/uplink/)'; then
            echo "Gated PRs must not change Uplink pack files (uplink-*.yml, install-git-uplink, uplink-* actions, .github/uplink/)."
            echo "Edit product workflows as needed. Change sidecars on main via git uplink init --upgrade."
            exit 1
          fi
          # .uplink/ is Uplink's own state. It is not scanned by the
          # assessment, so it must not be part of gated work.
          if git diff --name-only "$FROM_SHA" "$HEAD_SHA" | grep -q '^\.uplink/'; then
            echo "Gated PRs must not change files under .uplink/."
            exit 1
          fi
          if git grep -I -l '^<<<<<<<' -- . ':!.uplink' >/dev/null 2>&1; then
            echo "Conflict markers still present; remove them before merge."
            exit 1
          fi

      - name: Run company toolchain hook
        uses: $/.github/actions/uplink-toolchain-hook
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # No token in this step: git uplink refuses to run preflight.sh in a
      # CI job step that holds one.
      - name: Validate gated work
        id: run
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Internal-only patches never leave the company: skip the upstream
          # assessment and run only the preflight script, as for
          # transfer-to-internal. If the queue cannot be read, assess.
          is_internal() {
            local queue
            queue=$(git show uplink/state:.uplink/queue.json 2>/dev/null || cat .uplink/queue.json 2>/dev/null) || return 1
            jq -e --arg id "$1" 'any(.internal[]?; .id == $id)' <<<"$queue" >/dev/null
          }
          # The result goes to the comment job; the next step fails on it.
          # preflight.sh prints to this log (stderr).
          run_preflight() {
            local report
            echo "preflight=true" >> "$GITHUB_OUTPUT"
            report=$(git uplink preflight --json "$@") || true
            if ! jq -e . >/dev/null 2>&1 <<<"$report"; then
              echo "git uplink printed no preflight result"
              exit 1
            fi
            echo "report=$(jq -c . <<<"$report")" >> "$GITHUB_OUTPUT"
          }
          if [[ "$BASE_REF" == uplink/conflict/* ]] && is_internal "${BASE_REF#uplink/conflict/}"; then
            run_preflight --command-only
          elif [[ "$BASE_REF" == uplink/amend/* ]] && is_internal "${BASE_REF#uplink/amend/}"; then
            run_preflight --command-only
          elif [[ "$BASE_REF" == uplink/conflict/* ]]; then
            # The resolution is new code, and the PR title and description
            # become the patch message on merge: assess both, as resolve will
            # after merge. A failure blocks the merge.
            {
              printf '%s\n\n' "$TITLE"
              printf '%s\n' "${BODY:-}"
            } > /tmp/uplink-msg.txt
            git uplink assess --patch "${BASE_REF#uplink/conflict/}" \
              --message-file /tmp/uplink-msg.txt \
              --from "$FROM_SHA" \
              --head "$HEAD_SHA"
          elif [[ "$BASE_REF" == uplink/amend/* ]]; then
            # The PR title and description become the patch message on merge.
            # Assess the whole amended patch (base^ is the commit before it),
            # then run export preflight on it, as amend --complete will after
            # merge: upstream, its declared dependencies, then the change.
            # The assessment hook job runs only when both pass.
            {
              printf '%s\n\n' "$TITLE"
              printf '%s\n' "${BODY:-}"
            } > /tmp/uplink-msg.txt
            git uplink assess --patch "${BASE_REF#uplink/amend/}" \
              --message-file /tmp/uplink-msg.txt \
              --from "${FROM_SHA}^" \
              --head "$HEAD_SHA"
            run_preflight \
              --message-file /tmp/uplink-msg.txt \
              --from "${FROM_SHA}^" \
              --head "$HEAD_SHA"
          elif [[ "$BASE_REF" == uplink/transfer-to-upstream/* ]]; then
            # Preflight first, so the preflight comment is updated even when
            # the assessment fails, then assess as transfer --complete will
            # after merge. The assessment hook job runs only when both pass.
            # Not --patch: the patch is still internal, and --patch would
            # assess it so.
            {
              printf '%s\n\n' "$TITLE"
              printf '%s\n' "${BODY:-}"
            } > /tmp/uplink-msg.txt
            run_preflight \
              --message-file /tmp/uplink-msg.txt \
              --from "$FROM_SHA" \
              --head "$HEAD_SHA"
            git uplink assess \
              --message-file /tmp/uplink-msg.txt \
              --from "$FROM_SHA" \
              --head "$HEAD_SHA"
          elif [[ "$BASE_REF" == uplink/transfer-to-internal/* ]]; then
            run_preflight --command-only
          fi

      - name: Fail when preflight did not pass
        if: ${{ steps.run.outputs.report != '' }}
        env:
          REPORT: ${{ steps.run.outputs.report }}
        run: jq -e '.ok == true' <<<"$REPORT" > /dev/null

  # Never runs preflight.sh. The action is the default branch's copy, not the
  # gated tree's.
  preflight-comment:
    name: Uplink gate preflight comment
    needs: validate
    if: ${{ always() && needs.validate.outputs.preflight == 'true' && needs.validate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions

      - uses: $/.github/actions/uplink-preflight-comment
        with:
          report: ${{ needs.validate.outputs.report }}
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # The company assessment hook, run as Uplink PR checks run it: the gated
  # change is assessed as an incoming change (kind `pr`), as advice. Only
  # for an upstream amend and a transfer to upstream, and only after
  # validate passed, so a failing gate does not cost a hook run. Nothing is
  # stored and uplink/state is not touched: the patch is updated, and
  # submit runs the hook on it, after merge.
  # Never runs preflight.sh and never checks out the gated tree. Nothing
  # from validate is read: preflight.sh ran in the step that writes its
  # outputs. Not for a PR from a fork: pull_request_target would give it
  # this job's write token and let it dispatch the hook.
  assessment-hook:
    name: Uplink gate assessment hook
    needs: validate
    if: ${{ needs.validate.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.event.pull_request.base.ref, 'uplink/amend/') || startsWith(github.event.pull_request.base.ref, 'uplink/transfer-to-upstream/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          signer: ${{ vars.UPLINK_SIGNER }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assess the gated change
        id: assess
        env:
          UPLINK_INTERNAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git uplink init
          auth=$(printf 'x-access-token:%s' "$UPLINK_INTERNAL_TOKEN" | base64 -w0)
          git \
            -c "http.${GITHUB_SERVER_URL}/.extraheader=" \
            -c "http.${GITHUB_SERVER_URL}/.extraheader=Authorization: Basic ${auth}" \
            fetch --quiet origin "$BASE_REF" "$HEAD_SHA"
          # The same routing as validate: an internal-only amend never leaves
          # the company, so it has no upstream assessment and no hook.
          is_internal() {
            local queue
            queue=$(git show uplink/state:.uplink/queue.json 2>/dev/null || cat .uplink/queue.json 2>/dev/null) || return 1
            jq -e --arg id "$1" 'any(.internal[]?; .id == $id)' <<<"$queue" >/dev/null
          }
          if [[ "$BASE_REF" == uplink/amend/* ]]; then
            id="${BASE_REF#uplink/amend/}"
            # An amend is assessed as the whole patch: base^ is the commit before it.
            from="${FROM_SHA}^"
            if is_internal "$id"; then
              echo "${id} is internal-only; no assessment hook."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            from="$FROM_SHA"
          fi
          {
            printf '%s\n\n' "$TITLE"
            printf '%s\n' "${BODY:-}"
          } > "$RUNNER_TEMP/uplink-msg.txt"
          out="$RUNNER_TEMP/uplink-assessment"
          git uplink assess \
            --message-file "$RUNNER_TEMP/uplink-msg.txt" \
            --from "$from" \
            --head "$HEAD_SHA" \
            --package "$out" > /dev/null || true
          if [ ! -s "$out/assessment.json" ]; then
            echo "git uplink assess wrote no assessment package"
            exit 1
          fi
          cat "$out/assessment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "ok=$(jq -r '.ok == true' "$out/assessment.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.assess.outputs.run == 'true'
        with:
          name: uplink-assessment
          path: ${{ runner.temp }}/uplink-assessment/
          if-no-files-found: error
          overwrite: true

      # As at submit: nobody is asked about a change with findings.
      - name: Run company assessment hook
        id: hook
        if: steps.assess.outputs.ok == 'true'
        uses: $/.github/actions/uplink-assessment-hook
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the assessment comment
        if: steps.assess.outputs.run == 'true'
        uses: $/.github/actions/uplink-assessment-comment
        with:
          package-dir: ${{ runner.temp }}/uplink-assessment
          hook-dir: ${{ steps.hook.outputs.dir }}
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
