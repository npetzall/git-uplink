# GitHub forge pack (`git uplink init --forge github`).
# Installs git-uplink from a GitHub release.
# Empty UPLINK_*_AUTH defaults to app.
#
# Dispatch starts a transfer. If apply+assess+preflight pass, the queue is
# updated immediately. If byte changes are needed, this workflow pushes the
# protected base and -work branch and opens a PR. Merging that PR runs
# --complete. Closing it without merging deletes both branches and leaves
# the queue unchanged. Successful --to-internal of a submitted patch
# dispatches Uplink abandon contrib (fire-and-forget; no uplink-mutate).
# With repository variable UPLINK_AUTO_SUBMIT set to `true`, a patch moved
# --to-upstream with no unmerged upstream dependency gets Uplink submit
# dispatched.
# Closed-PR jobs load YAML from the default branch so *-work cannot replace
# this sidecar.
name: Uplink transfer
run-name: Uplink transfer ${{ inputs.patch_id || github.event.pull_request.base.ref }}

on: # zizmor: ignore[dangerous-triggers] YAML from default branch; gated tree is data
  workflow_dispatch:
    inputs:
      patch_id:
        description: Patch id to move (upl_…)
        required: true
      direction:
        description: Destination queue
        required: true
        type: choice
        options:
          - to-upstream
          - to-internal
  pull_request_target:
    types: [closed]
    branches:
      - "uplink/transfer-to-upstream/**"
      - "uplink/transfer-to-internal/**"

concurrency:
  group: uplink-mutate
  queue: max

permissions: {}

jobs:
  # preflight.sh builds and runs product code (public upstream's included),
  # so it runs in this job: read-only token, no App token, no Environment,
  # no credentials in the checkout. The job that holds the write tokens
  # takes the result and never runs the script.
  start-preflight:
    name: Preflight the transfer (no credentials)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch what preflight reads
        env:
          UPLINK_INTERNAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git uplink init

      - name: Run company toolchain hook
        uses: $/.github/actions/uplink-toolchain-hook
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # No token in this step: git uplink refuses to run preflight.sh in a
      # CI job step that holds one.
      - name: Run preflight.sh
        id: run
        env:
          PATCH_ID: ${{ inputs.patch_id }}
          DIRECTION: ${{ inputs.direction }}
        run: |
          report=$(git uplink transfer "$PATCH_ID" --"$DIRECTION" --preflight-only) || true
          if ! jq -e . >/dev/null 2>&1 <<<"$report"; then
            echo "git uplink printed no preflight result"
            exit 1
          fi
          echo "report=$(jq -c . <<<"$report")" >> "$GITHUB_OUTPUT"

  start:
    name: Start transfer
    needs: start-preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Read upstream and contrib from the queue
        id: queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          content=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.uplink/queue.json?ref=uplink%2Fstate" --jq .content)
          queue=$(printf '%s' "$content" | tr -d '\n' | base64 -d)
          parse_owner_repo() {
            local url=$1 owner repo
            if [[ "$url" =~ github.com[:/]([^/]+)/(.+)$ ]]; then
              owner=${BASH_REMATCH[1]}
              repo=${BASH_REMATCH[2]}
              repo=${repo%.git}
              repo=${repo%/}
              printf '%s\n%s\n' "$owner" "$repo"
              return 0
            fi
            echo "Could not parse GitHub owner/repo from queue URL" >&2
            return 1
          }
          upstream_url=$(jq -r '.config.upstreamUrl // empty' <<<"$queue")
          contrib_url=$(jq -r '.config.contribUrl // empty' <<<"$queue")
          if [ -z "$upstream_url" ] || [ -z "$contrib_url" ]; then
            echo "queue.json is missing upstreamUrl or contribUrl" >&2
            exit 1
          fi
          mapfile -t upstream < <(parse_owner_repo "$upstream_url")
          mapfile -t contrib < <(parse_owner_repo "$contrib_url")
          same_owner=false
          upstream_lc=$(printf '%s' "${upstream[0]}" | tr '[:upper:]' '[:lower:]')
          contrib_lc=$(printf '%s' "${contrib[0]}" | tr '[:upper:]' '[:lower:]')
          if [ "$upstream_lc" = "$contrib_lc" ]; then
            same_owner=true
          fi
          {
            echo "upstream_owner=${upstream[0]}"
            echo "upstream_repo=${upstream[1]}"
            echo "contrib_owner=${contrib[0]}"
            echo "contrib_repo=${contrib[1]}"
            echo "same_owner=${same_owner}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ steps.queue.outputs.upstream_owner }}
          repositories: ${{ steps.queue.outputs.upstream_repo }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}

      - name: Transfer patch
        id: transfer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
          PATCH_ID: ${{ inputs.patch_id }}
          DIRECTION: ${{ inputs.direction }}
          PREFLIGHT_REPORT: ${{ needs.start-preflight.outputs.report }}
        run: |
          git uplink init
          printf '%s' "$PREFLIGHT_REPORT" > "$RUNNER_TEMP/uplink-preflight.json"
          main_before=$(git rev-parse HEAD)

          # A failed preflight in the result gates the transfer, as before.
          transfer_json=$(git uplink transfer "$PATCH_ID" --"$DIRECTION" \
            --preflight-result "$RUNNER_TEMP/uplink-preflight.json")
          gated=$(jq -r '.gated // false' <<<"$transfer_json")
          if [ "$gated" != "true" ]; then
            git push origin uplink/state
            echo "ready_to_submit=$(jq -c '.readyToSubmit // []' <<<"$transfer_json")" >> "$GITHUB_OUTPUT"
            main_after=$(git rev-parse HEAD)
            if [ "$main_after" != "$main_before" ]; then
              git push origin HEAD:main --force
            fi
            close_url=$(jq -r '.gh.prClose.url // empty' <<<"$transfer_json")
            close_branch=$(jq -r '.gh.prClose.contribBranch // empty' <<<"$transfer_json")
            if [ -n "$close_url" ] || [ -n "$close_branch" ]; then
              if ! gh workflow run "Uplink abandon contrib" --ref main \
                -f "patch_id=${PATCH_ID}" \
                -f "pr_url=${close_url}" \
                -f "contrib_branch=${close_branch}"; then
                echo "::warning::Failed to dispatch Uplink abandon contrib for ${PATCH_ID}; public PR/branch may remain until abandon-contrib is run."
              fi
            fi
            # The patch is moved, and preflight.sh fails on the rebuilt tree:
            # the first patch it fails on gets a conflict PR, as in sync.
            if jq -e '.conflict != null' <<<"$transfer_json" >/dev/null; then
              conflict_id=$(jq -r '.conflict.id // empty' <<<"$transfer_json")
              conflict_branch=$(jq -r '.conflict.branch // empty' <<<"$transfer_json")
              work_branch=$(jq -r '.conflict.workBranch // empty' <<<"$transfer_json")
              if [ -z "$conflict_id" ] || [ "$conflict_id" = "null" ]; then
                echo "transfer recorded a conflict but no conflict patch id was present"
                exit 1
              fi
              if git show-ref --verify --quiet "refs/heads/${conflict_branch}"; then
                git push origin "refs/heads/${conflict_branch}:refs/heads/${conflict_branch}" --force
              fi
              if [ -n "$work_branch" ] && git show-ref --verify --quiet "refs/heads/${work_branch}"; then
                git push origin "refs/heads/${work_branch}:refs/heads/${work_branch}" --force
              fi

              title=$(jq -r '.gh.prCreate.title' <<<"$transfer_json")
              body_file=$(jq -r '.gh.prCreate.bodyFile' <<<"$transfer_json")
              head=$(jq -r '.gh.prCreate.head' <<<"$transfer_json")
              base=$(jq -r '.gh.prCreate.base' <<<"$transfer_json")
              existing=$(gh pr list --head "$head" --base "$base" --state open --json url --jq '.[0].url')
              if [ -z "$existing" ]; then
                gh label create uplink:conflict --description "Uplink sync conflict; resolve via the gated work PR" --color B60205 || true
                # The internal bot opens the PR: GITHUB_TOKEN may not create PRs, and a
                # bot-opened PR triggers the Uplink gate check. The Actions token labels it.
                url=$(GH_TOKEN="$UPLINK_INTERNAL_TOKEN" gh pr create --title "$title" --base "$base" --head "$head" --body-file "$body_file")
                gh pr edit "$url" --add-label uplink:conflict
              else
                url="$existing"
              fi
              git uplink gated "$conflict_id" --pr-url "$url"
            fi
            exit 0
          fi

          base=$(jq -r '.base // empty' <<<"$transfer_json")
          work=$(jq -r '.work // empty' <<<"$transfer_json")
          if [ -z "$base" ] || [ -z "$work" ]; then
            echo "transfer is gated but no base/work branches were recorded"
            exit 1
          fi
          git push origin "refs/heads/${base}:refs/heads/${base}" --force
          git push origin "refs/heads/${work}:refs/heads/${work}" --force
          title=$(jq -r '.gh.prCreate.title' <<<"$transfer_json")
          body_file=$(jq -r '.gh.prCreate.bodyFile' <<<"$transfer_json")
          label=$(jq -r '.gh.prCreate.labels[0]' <<<"$transfer_json")
          existing=$(gh pr list --head "$work" --base "$base" --state open --json url --jq '.[0].url')
          if [ -z "$existing" ]; then
            gh label create "$label" --description "Uplink gated transfer" --color 1D76DB || true
            # The internal bot opens the PR: GITHUB_TOKEN may not create PRs, and a
            # bot-opened PR triggers the Uplink gate check. The Actions token labels it.
            url=$(GH_TOKEN="$UPLINK_INTERNAL_TOKEN" gh pr create --title "$title" --base "$base" --head "$work" --body-file "$body_file")
            gh pr edit "$url" --add-label "$label"
          else
            echo "Reusing existing transfer PR $existing"
          fi

      - name: Dispatch Uplink submit for patches that became ready
        if: ${{ vars.UPLINK_AUTO_SUBMIT == 'true' && steps.transfer.outputs.ready_to_submit != '' && steps.transfer.outputs.ready_to_submit != '[]' }}
        uses: $/.github/actions/uplink-dispatch-submit
        with:
          patch-ids: ${{ steps.transfer.outputs.ready_to_submit }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # A rebuild writes every commit of main again. Tell the open pull
      # requests it left behind how to rebase; a failure here is not a
      # failure of the job.
      - name: Tell open pull requests about a rebuilt main
        continue-on-error: true
        uses: $/.github/actions/uplink-rebase-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          auto-rebase: ${{ vars.UPLINK_AUTO_REBASE }}

  # preflight.sh builds and runs product code (public upstream's included),
  # so it runs in this job: read-only token, no App token, no Environment,
  # no credentials in the checkout. The job that holds the write tokens
  # takes the result and never runs the script.
  complete-preflight:
    name: Preflight the gated transfer (no credentials)
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && !endsWith(github.event.pull_request.base.ref, '-work')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch what preflight reads
        env:
          UPLINK_INTERNAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git uplink init

      - name: Run company toolchain hook
        uses: $/.github/actions/uplink-toolchain-hook
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # No token in this step: git uplink refuses to run preflight.sh in a
      # CI job step that holds one.
      - name: Run preflight.sh
        id: run
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_REF" == uplink/transfer-to-upstream/* ]]; then
            id="${BASE_REF#uplink/transfer-to-upstream/}"
            direction=to-upstream
          elif [[ "$BASE_REF" == uplink/transfer-to-internal/* ]]; then
            id="${BASE_REF#uplink/transfer-to-internal/}"
            direction=to-internal
          else
            echo "Unexpected base $BASE_REF"
            exit 1
          fi
          report=$(git uplink transfer "$id" --"$direction" --complete --preflight-only) || true
          if ! jq -e . >/dev/null 2>&1 <<<"$report"; then
            echo "git uplink printed no preflight result"
            exit 1
          fi
          echo "report=$(jq -c . <<<"$report")" >> "$GITHUB_OUTPUT"

  complete:
    name: Complete transfer
    needs: complete-preflight
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && !endsWith(github.event.pull_request.base.ref, '-work')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Read upstream and contrib from the queue
        id: queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          content=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.uplink/queue.json?ref=uplink%2Fstate" --jq .content)
          queue=$(printf '%s' "$content" | tr -d '\n' | base64 -d)
          parse_owner_repo() {
            local url=$1 owner repo
            if [[ "$url" =~ github.com[:/]([^/]+)/(.+)$ ]]; then
              owner=${BASH_REMATCH[1]}
              repo=${BASH_REMATCH[2]}
              repo=${repo%.git}
              repo=${repo%/}
              printf '%s\n%s\n' "$owner" "$repo"
              return 0
            fi
            echo "Could not parse GitHub owner/repo from queue URL" >&2
            return 1
          }
          upstream_url=$(jq -r '.config.upstreamUrl // empty' <<<"$queue")
          contrib_url=$(jq -r '.config.contribUrl // empty' <<<"$queue")
          if [ -z "$upstream_url" ] || [ -z "$contrib_url" ]; then
            echo "queue.json is missing upstreamUrl or contribUrl" >&2
            exit 1
          fi
          mapfile -t upstream < <(parse_owner_repo "$upstream_url")
          mapfile -t contrib < <(parse_owner_repo "$contrib_url")
          same_owner=false
          upstream_lc=$(printf '%s' "${upstream[0]}" | tr '[:upper:]' '[:lower:]')
          contrib_lc=$(printf '%s' "${contrib[0]}" | tr '[:upper:]' '[:lower:]')
          if [ "$upstream_lc" = "$contrib_lc" ]; then
            same_owner=true
          fi
          {
            echo "upstream_owner=${upstream[0]}"
            echo "upstream_repo=${upstream[1]}"
            echo "contrib_owner=${contrib[0]}"
            echo "contrib_repo=${contrib[1]}"
            echo "same_owner=${same_owner}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ steps.queue.outputs.upstream_owner }}
          repositories: ${{ steps.queue.outputs.upstream_repo }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}

      - name: Complete gated transfer
        id: transfer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PREFLIGHT_REPORT: ${{ needs.complete-preflight.outputs.report }}
        run: |
          git uplink init
          printf '%s' "$PREFLIGHT_REPORT" > "$RUNNER_TEMP/uplink-preflight.json"
          if [[ "$BASE_REF" == uplink/transfer-to-upstream/* ]]; then
            id="${BASE_REF#uplink/transfer-to-upstream/}"
            direction=to-upstream
          elif [[ "$BASE_REF" == uplink/transfer-to-internal/* ]]; then
            id="${BASE_REF#uplink/transfer-to-internal/}"
            direction=to-internal
          else
            echo "Unexpected base $BASE_REF"
            exit 1
          fi
          if [ -z "$id" ] || [[ "$id" == *-work ]]; then
            echo "Could not parse patch id from $BASE_REF"
            exit 1
          fi

          main_before=$(git rev-parse origin/main)
          transfer_json=$(git uplink transfer "$id" --"$direction" --complete \
            --preflight-result "$RUNNER_TEMP/uplink-preflight.json")

          head=$(git rev-parse --abbrev-ref HEAD)
          if [ "$head" != "main" ]; then
            echo "HEAD is ${head}, not main; refusing to push"
            exit 1
          fi

          git push origin uplink/state
          echo "ready_to_submit=$(jq -c '.readyToSubmit // []' <<<"$transfer_json")" >> "$GITHUB_OUTPUT"
          main_after=$(git rev-parse HEAD)
          if [ "$main_after" != "$main_before" ]; then
            git push origin main --force
          fi
          close_url=$(jq -r '.gh.prClose.url // empty' <<<"$transfer_json")
          close_branch=$(jq -r '.gh.prClose.contribBranch // empty' <<<"$transfer_json")
          if [ -n "$close_url" ] || [ -n "$close_branch" ]; then
            if ! gh workflow run "Uplink abandon contrib" --ref main \
              -f "patch_id=${id}" \
              -f "pr_url=${close_url}" \
              -f "contrib_branch=${close_branch}"; then
              echo "::warning::Failed to dispatch Uplink abandon contrib for ${id}; public PR/branch may remain until abandon-contrib is run."
            fi
          fi
          # The patch is moved, and preflight.sh fails on the rebuilt tree:
          # the first patch it fails on gets a conflict PR, as in sync.
          if jq -e '.conflict != null' <<<"$transfer_json" >/dev/null; then
            conflict_id=$(jq -r '.conflict.id // empty' <<<"$transfer_json")
            conflict_branch=$(jq -r '.conflict.branch // empty' <<<"$transfer_json")
            work_branch=$(jq -r '.conflict.workBranch // empty' <<<"$transfer_json")
            if [ -z "$conflict_id" ] || [ "$conflict_id" = "null" ]; then
              echo "transfer recorded a conflict but no conflict patch id was present"
              exit 1
            fi
            if git show-ref --verify --quiet "refs/heads/${conflict_branch}"; then
              git push origin "refs/heads/${conflict_branch}:refs/heads/${conflict_branch}" --force
            fi
            if [ -n "$work_branch" ] && git show-ref --verify --quiet "refs/heads/${work_branch}"; then
              git push origin "refs/heads/${work_branch}:refs/heads/${work_branch}" --force
            fi

            title=$(jq -r '.gh.prCreate.title' <<<"$transfer_json")
            body_file=$(jq -r '.gh.prCreate.bodyFile' <<<"$transfer_json")
            head=$(jq -r '.gh.prCreate.head' <<<"$transfer_json")
            base=$(jq -r '.gh.prCreate.base' <<<"$transfer_json")
            existing=$(gh pr list --head "$head" --base "$base" --state open --json url --jq '.[0].url')
            if [ -z "$existing" ]; then
              gh label create uplink:conflict --description "Uplink sync conflict; resolve via the gated work PR" --color B60205 || true
              # The internal bot opens the PR: GITHUB_TOKEN may not create PRs, and a
              # bot-opened PR triggers the Uplink gate check. The Actions token labels it.
              url=$(GH_TOKEN="$UPLINK_INTERNAL_TOKEN" gh pr create --title "$title" --base "$base" --head "$head" --body-file "$body_file")
              gh pr edit "$url" --add-label uplink:conflict
            else
              url="$existing"
            fi
            git uplink gated "$conflict_id" --pr-url "$url"
          fi
          git push origin --delete "$BASE_REF" || true
          git push origin --delete "${BASE_REF}-work" || true

      - name: Dispatch Uplink submit for patches that became ready
        if: ${{ vars.UPLINK_AUTO_SUBMIT == 'true' && steps.transfer.outputs.ready_to_submit != '' && steps.transfer.outputs.ready_to_submit != '[]' }}
        uses: $/.github/actions/uplink-dispatch-submit
        with:
          patch-ids: ${{ steps.transfer.outputs.ready_to_submit }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # A rebuild writes every commit of main again. Tell the open pull
      # requests it left behind how to rebase; a failure here is not a
      # failure of the job.
      - name: Tell open pull requests about a rebuilt main
        continue-on-error: true
        uses: $/.github/actions/uplink-rebase-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          auto-rebase: ${{ vars.UPLINK_AUTO_REBASE }}

  cleanup:
    name: Abort transfer
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == false && !endsWith(github.event.pull_request.base.ref, '-work')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}

      - name: Delete transfer branches
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push origin --delete "$BASE_REF" || true
          git push origin --delete "$HEAD_REF" || true
          if [[ "$BASE_REF" != *-work ]]; then
            git push origin --delete "${BASE_REF}-work" || true
          fi
