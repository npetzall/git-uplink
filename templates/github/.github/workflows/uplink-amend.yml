# GitHub forge pack (`git uplink init --forge github`).
# Installs git-uplink from a GitHub release.
# Empty UPLINK_*_AUTH defaults to app.
#
# Dispatch starts an amend: the queue is replayed on uplink/upstream up to
# and including the patch, which becomes the protected base
# uplink/amend/<id>. A -work branch one empty commit ahead is pushed and a
# draft PR is opened. Commit the change on -work and edit the PR title and
# description (they become the patch title and message). Merging runs
# git uplink amend --complete, which re-assesses the patch and rebuilds
# company main; a submitted patch becomes amended and Uplink submit is
# dispatched. Closing without merging deletes both branches and leaves the
# queue unchanged. Closed-PR jobs load YAML from the default branch so *-work
# cannot replace this sidecar.
name: Uplink amend
run-name: Uplink amend ${{ inputs.patch_id || github.event.pull_request.base.ref }}

on: # zizmor: ignore[dangerous-triggers] YAML from default branch; gated tree is data
  workflow_dispatch:
    inputs:
      patch_id:
        description: Patch id to amend (upl_…)
        required: true
  pull_request_target:
    types: [closed]
    branches:
      - "uplink/amend/**"

concurrency:
  group: uplink-mutate
  queue: max

permissions: {}

jobs:
  start:
    name: Start amend
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Read upstream and contrib from the queue
        id: queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          content=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.uplink/queue.json?ref=uplink%2Fstate" --jq .content)
          queue=$(printf '%s' "$content" | tr -d '\n' | base64 -d)
          parse_owner_repo() {
            local url=$1 owner repo
            if [[ "$url" =~ github.com[:/]([^/]+)/(.+)$ ]]; then
              owner=${BASH_REMATCH[1]}
              repo=${BASH_REMATCH[2]}
              repo=${repo%.git}
              repo=${repo%/}
              printf '%s\n%s\n' "$owner" "$repo"
              return 0
            fi
            echo "Could not parse GitHub owner/repo from queue URL" >&2
            return 1
          }
          upstream_url=$(jq -r '.config.upstreamUrl // empty' <<<"$queue")
          contrib_url=$(jq -r '.config.contribUrl // empty' <<<"$queue")
          if [ -z "$upstream_url" ] || [ -z "$contrib_url" ]; then
            echo "queue.json is missing upstreamUrl or contribUrl" >&2
            exit 1
          fi
          mapfile -t upstream < <(parse_owner_repo "$upstream_url")
          mapfile -t contrib < <(parse_owner_repo "$contrib_url")
          same_owner=false
          upstream_lc=$(printf '%s' "${upstream[0]}" | tr '[:upper:]' '[:lower:]')
          contrib_lc=$(printf '%s' "${contrib[0]}" | tr '[:upper:]' '[:lower:]')
          if [ "$upstream_lc" = "$contrib_lc" ]; then
            same_owner=true
          fi
          {
            echo "upstream_owner=${upstream[0]}"
            echo "upstream_repo=${upstream[1]}"
            echo "contrib_owner=${contrib[0]}"
            echo "contrib_repo=${contrib[1]}"
            echo "same_owner=${same_owner}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ steps.queue.outputs.upstream_owner }}
          repositories: ${{ steps.queue.outputs.upstream_repo }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}

      - name: Cut amend branches and open the draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
          PATCH_ID: ${{ inputs.patch_id }}
        run: |
          if [[ ! "$PATCH_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid patch id: $PATCH_ID"
            exit 1
          fi
          base="uplink/amend/${PATCH_ID}"
          # Never overwrite work in progress on an open amend.
          if git ls-remote --exit-code --heads origin "refs/heads/${base}" >/dev/null; then
            existing=$(gh pr list --base "$base" --state open --json url --jq '.[0].url')
            echo "::error::${PATCH_ID} already has an amend in progress ${existing}. Merge or close it first."
            exit 1
          fi
          git uplink init

          amend_json=$(git uplink amend "$PATCH_ID")
          base=$(jq -r '.base // empty' <<<"$amend_json")
          work=$(jq -r '.work // empty' <<<"$amend_json")
          if [ -z "$base" ] || [ -z "$work" ]; then
            echo "amend recorded no base/work branches"
            exit 1
          fi
          git push origin "refs/heads/${base}:refs/heads/${base}"
          git push origin "refs/heads/${work}:refs/heads/${work}"
          title=$(jq -r '.gh.prCreate.title' <<<"$amend_json")
          body_file=$(jq -r '.gh.prCreate.bodyFile' <<<"$amend_json")
          label=$(jq -r '.gh.prCreate.labels[0]' <<<"$amend_json")
          gh label create "$label" --description "Uplink gated amend of a patch" --color 0E8A16 || true
          # The internal bot opens the PR: GITHUB_TOKEN may not create PRs, and a
          # bot-opened PR triggers the Uplink gate check. The Actions token labels it.
          url=$(GH_TOKEN="$UPLINK_INTERNAL_TOKEN" gh pr create --draft --title "$title" --base "$base" --head "$work" --body-file "$body_file")
          gh pr edit "$url" --add-label "$label"
          echo "Amend PR: $url" >> "$GITHUB_STEP_SUMMARY"

  complete:
    name: Complete amend
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && !endsWith(github.event.pull_request.base.ref, '-work')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Read upstream and contrib from the queue
        id: queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          content=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.uplink/queue.json?ref=uplink%2Fstate" --jq .content)
          queue=$(printf '%s' "$content" | tr -d '\n' | base64 -d)
          parse_owner_repo() {
            local url=$1 owner repo
            if [[ "$url" =~ github.com[:/]([^/]+)/(.+)$ ]]; then
              owner=${BASH_REMATCH[1]}
              repo=${BASH_REMATCH[2]}
              repo=${repo%.git}
              repo=${repo%/}
              printf '%s\n%s\n' "$owner" "$repo"
              return 0
            fi
            echo "Could not parse GitHub owner/repo from queue URL" >&2
            return 1
          }
          upstream_url=$(jq -r '.config.upstreamUrl // empty' <<<"$queue")
          contrib_url=$(jq -r '.config.contribUrl // empty' <<<"$queue")
          if [ -z "$upstream_url" ] || [ -z "$contrib_url" ]; then
            echo "queue.json is missing upstreamUrl or contribUrl" >&2
            exit 1
          fi
          mapfile -t upstream < <(parse_owner_repo "$upstream_url")
          mapfile -t contrib < <(parse_owner_repo "$contrib_url")
          same_owner=false
          upstream_lc=$(printf '%s' "${upstream[0]}" | tr '[:upper:]' '[:lower:]')
          contrib_lc=$(printf '%s' "${contrib[0]}" | tr '[:upper:]' '[:lower:]')
          if [ "$upstream_lc" = "$contrib_lc" ]; then
            same_owner=true
          fi
          {
            echo "upstream_owner=${upstream[0]}"
            echo "upstream_repo=${upstream[1]}"
            echo "contrib_owner=${contrib[0]}"
            echo "contrib_repo=${contrib[1]}"
            echo "same_owner=${same_owner}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ steps.queue.outputs.upstream_owner }}
          repositories: ${{ steps.queue.outputs.upstream_repo }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}

      - name: Run company toolchain hook
        uses: $/.github/actions/uplink-toolchain-hook
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Amend patch and rebuild main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          git uplink init
          id="${BASE_REF#uplink/amend/}"
          if [ -z "$id" ] || [ "$id" = "$BASE_REF" ] || [[ "$id" == *-work ]]; then
            echo "Could not parse patch id from $BASE_REF"
            exit 1
          fi
          {
            printf '%s\n\n' "$TITLE"
            printf '%s\n' "${BODY:-}"
          } > "$RUNNER_TEMP/uplink-amend-msg.txt"

          main_before=$(git rev-parse origin/main)
          amend_json=$(git uplink amend "$id" --complete --title "$TITLE" --message-file "$RUNNER_TEMP/uplink-amend-msg.txt")

          head=$(git rev-parse --abbrev-ref HEAD)
          if [ "$head" != "main" ]; then
            echo "HEAD is ${head}, not main; refusing to push"
            exit 1
          fi

          git push origin uplink/state
          main_after=$(git rev-parse HEAD)
          if [ "$main_after" != "$main_before" ]; then
            git push origin main --force
          fi

          status=$(jq -r '.status // empty' <<<"$amend_json")
          if [ "$status" = "amended" ]; then
            runs=$(gh run list --workflow="Uplink submit" --limit 20 --json databaseId,displayTitle,status 2>/dev/null || echo '[]')
            echo "$runs" | jq -r --arg title "Uplink submit $id" \
              '.[] | select((.displayTitle // "") == $title and (.status == "waiting" or .status == "in_progress")) | .databaseId' \
              | while read -r run_id; do
              if [ -n "$run_id" ]; then
                gh run cancel "$run_id" || true
              fi
            done
            gh workflow run "Uplink submit" --ref main -f "patch_id=$id"
          fi

          if jq -e '.conflict != null' <<<"$amend_json" >/dev/null; then
            conflict_id=$(jq -r '.conflict.id // empty' <<<"$amend_json")
            conflict_branch=$(jq -r '.conflict.branch // empty' <<<"$amend_json")
            work_branch=$(jq -r '.conflict.workBranch // empty' <<<"$amend_json")
            if [ -z "$conflict_id" ] || [ "$conflict_id" = "null" ]; then
              echo "amend recorded a follow-on conflict but no conflict patch id was present"
              git push origin --delete "$BASE_REF" || true
              git push origin --delete "${BASE_REF}-work" || true
              exit 1
            fi
            if git show-ref --verify --quiet "refs/heads/${conflict_branch}"; then
              git push origin "refs/heads/${conflict_branch}:refs/heads/${conflict_branch}" --force
            fi
            if [ -n "$work_branch" ] && git show-ref --verify --quiet "refs/heads/${work_branch}"; then
              git push origin "refs/heads/${work_branch}:refs/heads/${work_branch}" --force
            fi

            title=$(jq -r '.gh.prCreate.title' <<<"$amend_json")
            body_file=$(jq -r '.gh.prCreate.bodyFile' <<<"$amend_json")
            head=$(jq -r '.gh.prCreate.head' <<<"$amend_json")
            base=$(jq -r '.gh.prCreate.base' <<<"$amend_json")
            existing=$(gh pr list --head "$head" --base "$base" --state open --json url --jq '.[0].url')
            if [ -z "$existing" ]; then
              gh label create uplink:conflict --description "Uplink sync conflict; resolve via the gated work PR" --color B60205 || true
              # The internal bot opens the PR: GITHUB_TOKEN may not create PRs, and a
              # bot-opened PR triggers the Uplink gate check. The Actions token labels it.
              url=$(GH_TOKEN="$UPLINK_INTERNAL_TOKEN" gh pr create --title "$title" --base "$base" --head "$head" --body-file "$body_file")
              gh pr edit "$url" --add-label uplink:conflict
            else
              url="$existing"
            fi
            git uplink gated "$conflict_id" --pr-url "$url"
          fi

          git push origin --delete "$BASE_REF" || true
          git push origin --delete "${BASE_REF}-work" || true

  cleanup:
    name: Abort amend
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == false && !endsWith(github.event.pull_request.base.ref, '-work')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}

      - name: Delete amend branches
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push origin --delete "$BASE_REF" || true
          git push origin --delete "$HEAD_REF" || true
          if [[ "$BASE_REF" != *-work ]]; then
            git push origin --delete "${BASE_REF}-work" || true
          fi
