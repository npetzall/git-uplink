# GitHub forge pack (`git uplink init --forge github`).
# Installs git-uplink from a GitHub release.
# Empty UPLINK_*_AUTH defaults to app.
#
# Only a pull request merged into main is imported. A merge into any other
# branch, including the gated uplink/conflict, uplink/amend and
# uplink/transfer-* bases, has not passed main's review and is handled by its
# own workflow or not at all. `add --base-branch` refuses it again, in case
# the filter below is edited.
name: Uplink import

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: uplink-mutate
  queue: max

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  import:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: $/.github/actions/install-git-uplink
        with:
          repo: ${{ vars.UPLINK_SRC }}
          version: ${{ vars.UPLINK_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH != 'pat' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Run company toolchain hook
        uses: $/.github/actions/uplink-toolchain-hook
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import as a queued patch
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          INTERNAL_ONLY: ${{ contains(github.event.pull_request.labels.*.name, 'uplink:internal-only') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
        run: |
          git uplink init
          extra=()
          if [ "$INTERNAL_ONLY" = "true" ]; then extra+=(--internal-only); fi
          {
            printf '%s\n\n' "$TITLE"
            printf '%s\n' "${BODY:-}"
          } > /tmp/uplink-msg.txt
          # Keep the company assessment-hook result from the PR checks when it
          # was made for exactly what was merged (head commit, title, body).
          # Otherwise submit runs the hook again.
          if [ "$INTERNAL_ONLY" != "true" ]; then
            fingerprint=$({ printf '%s\n' "$HEAD_SHA"; cat /tmp/uplink-msg.txt; } | sha256sum | cut -c1-16)
            runs=$(gh run list --workflow uplink-pr.yml --commit "$HEAD_SHA" --status completed \
              --limit 10 --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId' || true)
            for run in $runs; do
              dir="$RUNNER_TEMP/uplink-assessment-${run}"
              gh run download "$run" -n uplink-assessment -D "$dir" 2>/dev/null || continue
              [ "$(cat "$dir/fingerprint" 2>/dev/null)" = "$fingerprint" ] || continue
              if [ "$(cat "$dir/hook-status")" = "success" ] && [ -d "$dir/extras" ]; then
                extra+=(--extra-dir "$dir/extras" --extra-source "$(cat "$dir/hook-run-url")")
                echo "Storing company extras from PR check run ${run}."
              fi
              break
            done
          fi
          set +e
          git uplink add --title "$TITLE" --message-file /tmp/uplink-msg.txt \
            --from "$FROM_SHA" --head "$HEAD_SHA" --base-branch "$BASE_REF" \
            --pr "$PR_NUMBER" --pr-url "$PR_URL" "${extra[@]}" > /tmp/uplink-add.out
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if [ -s /tmp/uplink-add.out ]; then
              gh pr comment "$PR_NUMBER" --body-file /tmp/uplink-add.out
            fi
            exit "$code"
          fi
          rebuild=false
          if [ "$INTERNAL_ONLY" != "true" ]; then
            active=$(jq '[.internal[]? | select(.status != "merged" and .status != "dropped")] | length' .uplink/queue.json)
            if [ "$active" != "0" ]; then rebuild=true; fi
          fi
          if [ "$rebuild" = "true" ]; then
            git uplink rebuild --push
          else
            git uplink push
          fi
