# example-github forge pack (`git uplink init --forge example-github`).
# Installs git-uplink and is
# workflow_dispatch only (no hourly cron) so a walkthrough is not raced.
# Empty UPLINK_*_AUTH defaults to pat.
name: Uplink sync

on:
  workflow_dispatch:

concurrency:
  group: uplink-sync
  cancel-in-progress: false

permissions: {}

jobs:
  inspect:
    name: Inspect upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    outputs:
      needs_approval: ${{ steps.sync.outputs.needs_approval }}
    steps:
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH == 'app' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH == 'app' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ secrets.UPLINK_UPSTREAM_OWNER }}
          repositories: ${{ secrets.UPLINK_UPSTREAM_REPO }}
          permission-contents: read

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
      - uses: $/.github/actions/install-git-uplink
        with:
          src: ${{ vars.UPLINK_SRC }}
          rev: ${{ vars.UPLINK_REV }}

      - name: Sync with upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
        run: |
          git uplink init
          main_before=$(git rev-parse HEAD)

          set +e
          sync_json=$(git uplink sync)
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

          needs_approval=$(jq -r '.needsApproval // false' <<<"$sync_json")
          echo "needs_approval=${needs_approval}" >> "$GITHUB_OUTPUT"

          git push origin uplink/state
          if [ "$needs_approval" = "true" ]; then
            exit 0
          fi

          git push origin uplink/upstream --force || true

          main_after=$(git rev-parse HEAD)
          if [ "$main_after" != "$main_before" ]; then
            git push origin HEAD:main --force-with-lease
          fi

          if [ "$code" -ne 2 ]; then
            exit 0
          fi

          conflict_id=$(jq -r '.conflict.id // empty' <<<"$sync_json")
          conflict_branch=$(jq -r '.conflict.branch // empty' <<<"$sync_json")
          if [ -z "$conflict_id" ] || [ "$conflict_id" = "null" ]; then
            echo "sync exited 2 but no conflict patch was recorded"
            exit 2
          fi
          if git show-ref --verify --quiet "refs/heads/${conflict_branch}"; then
            git push origin "refs/heads/${conflict_branch}:refs/heads/${conflict_branch}" --force
          fi

          title=$(jq -r '.gh.issueCreate.title' <<<"$sync_json")
          body_file=$(jq -r '.gh.issueCreate.bodyFile' <<<"$sync_json")
          existing=$(gh issue list --state open --json url,title --jq ".[] | select(.title==\"${title}\") | .url" | head -n 1)
          if [ -z "$existing" ]; then
            gh label create uplink:conflict --description "Uplink sync conflict; checkout the conflict branch, do not open a PR" --color B60205 || true
            url=$(gh issue create --title "$title" --label uplink:conflict --body-file "$body_file")
          else
            url="$existing"
          fi
          git uplink conflicted "$conflict_id" --issue-url "$url"
          exit 2

  apply:
    name: Approve from-upstream environment and apply
    needs: inspect
    if: needs.inspect.outputs.needs_approval == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      deployments: write
    environment:
      name: from-upstream
      url: ${{ github.server_url }}/${{ github.repository }}/blob/uplink/state/.uplink/reports/from-upstream/incoming.md
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    steps:
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH == 'app' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH == 'app' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ secrets.UPLINK_UPSTREAM_OWNER }}
          repositories: ${{ secrets.UPLINK_UPSTREAM_REPO }}
          permission-contents: read

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
      - uses: $/.github/actions/install-git-uplink
        with:
          src: ${{ vars.UPLINK_SRC }}
          rev: ${{ vars.UPLINK_REV }}

      - name: Accept pending upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
          UPLINK_FROM_UPSTREAM_ENVIRONMENT: from-upstream
        run: |
          git uplink init
          main_before=$(git rev-parse HEAD)

          set +e
          sync_json=$(git uplink accept-upstream)
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

          git push origin uplink/state
          git push origin uplink/upstream --force || true

          main_after=$(git rev-parse HEAD)
          if [ "$main_after" != "$main_before" ]; then
            git push origin HEAD:main --force-with-lease
          fi

          if [ "$code" -ne 2 ]; then
            exit 0
          fi

          conflict_id=$(jq -r '.conflict.id // empty' <<<"$sync_json")
          conflict_branch=$(jq -r '.conflict.branch // empty' <<<"$sync_json")
          if [ -z "$conflict_id" ] || [ "$conflict_id" = "null" ]; then
            echo "accept-upstream exited 2 but no conflict patch was recorded"
            exit 2
          fi
          if git show-ref --verify --quiet "refs/heads/${conflict_branch}"; then
            git push origin "refs/heads/${conflict_branch}:refs/heads/${conflict_branch}" --force
          fi

          title=$(jq -r '.gh.issueCreate.title' <<<"$sync_json")
          body_file=$(jq -r '.gh.issueCreate.bodyFile' <<<"$sync_json")
          existing=$(gh issue list --state open --json url,title --jq ".[] | select(.title==\"${title}\") | .url" | head -n 1)
          if [ -z "$existing" ]; then
            gh label create uplink:conflict --description "Uplink sync conflict; checkout the conflict branch, do not open a PR" --color B60205 || true
            url=$(gh issue create --title "$title" --label uplink:conflict --body-file "$body_file")
          else
            url="$existing"
          fi
          git uplink conflicted "$conflict_id" --issue-url "$url"
          exit 2
