packages:
  - web
  - site

# One version of each dependency web and site share; they reference it as `catalog:`.
catalog:
  "@biomejs/biome": 2.6.7
  "@radix-ui/react-slot": ^1.1.2
  "@tailwindcss/vite": ^4.3.5
  "@types/react": ^19.0.10
  "@types/react-dom": ^19.0.4
  "@vitejs/plugin-react": ^6.3.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.73.0
  react: ^19.0.0
  react-dom: ^19.0.0
  react-router-dom: ^7.18.5
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.5
  typescript: ^7.0.2
  vite: ^8.3.8
  vitest: ^5.1.0

allowBuilds:
  fsevents: true

overrides:
  katex: 0.19.0
  lodash-es: 4.18.1

audit:
  ignore:
    # picomatch ReDoS from a crafted extglob pattern. Only build and test
    # tools (vite, vitest, tailwind) use it, with patterns from our own
    # config; nothing ships in site/ or web/. No patched version yet.
    - GHSA-fc5q-39xc-vjpf
