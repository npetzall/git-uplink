# Wipe uplink/<id> and other leftover heads on the contrib fork.
# Does not move main and does not close PRs (those live on upstream).
name: Reset example

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete extra branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/reset-example.sh
