# Example copy of templates/emu-workflows/uplink-resolve.yml.
# Keep behavior in sync. This copy installs git-uplink on the runner.
# Empty UPLINK_*_AUTH defaults to pat.
name: Uplink resolve

on:
  push:
    branches:
      - "uplink/conflict/**"

concurrency:
  group: uplink-mutate
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.author.name != 'Uplink Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Mint internal GitHub App token
        id: internal-app
        if: ${{ vars.UPLINK_INTERNAL_AUTH == 'app' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPLINK_INTERNAL_APP_ID }}
          private-key: ${{ secrets.UPLINK_INTERNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Mint upstream GitHub App token
        id: upstream-app
        if: ${{ vars.UPLINK_UPSTREAM_AUTH == 'app' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPLINK_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPLINK_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ secrets.UPLINK_UPSTREAM_OWNER }}
          repositories: ${{ secrets.UPLINK_UPSTREAM_REPO }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
      - uses: ./.github/actions/install-git-uplink
        with:
          src: ${{ vars.UPLINK_SRC }}
          rev: ${{ vars.UPLINK_REV }}

      - name: Configure uplink remotes
        env:
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
        run: git uplink init

      - name: Resolve patch and rebuild main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLINK_INTERNAL_TOKEN: ${{ steps.internal-app.outputs.token || secrets.UPLINK_INTERNAL_TOKEN }}
          UPLINK_UPSTREAM_TOKEN: ${{ steps.upstream-app.outputs.token || secrets.UPLINK_UPSTREAM_TOKEN }}
        run: |
          git fetch origin main
          git branch -f main origin/main
          git fetch origin '+refs/heads/uplink/upstream:refs/heads/uplink/upstream'
          git fetch origin '+refs/heads/uplink/state:refs/heads/uplink/state'
          id="${GITHUB_REF_NAME#uplink/conflict/}"
          if [ -z "$id" ] || [ "$id" = "$GITHUB_REF_NAME" ]; then
            echo "Could not parse patch id from $GITHUB_REF_NAME"
            exit 1
          fi

          main_before=$(git rev-parse origin/main)

          set +e
          resolve_json=$(git uplink resolve "$id")
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

          head=$(git rev-parse --abbrev-ref HEAD)
          if [ "$head" != "main" ]; then
            echo "HEAD is ${head}, not main; refusing to push"
            exit 1
          fi

          git push origin uplink/state
          main_after=$(git rev-parse HEAD)
          if [ "$main_after" != "$main_before" ]; then
            git push origin main --force-with-lease
          fi

          status=$(jq -r '.status // empty' <<<"$resolve_json")
          if [ -z "$status" ]; then
            queue_json=$(git show uplink/state:.uplink/queue.json 2>/dev/null || cat .uplink/queue.json)
            status=$(printf '%s\n' "$queue_json" | jq -r --arg id "$id" '.patches[] | select(.id==$id) | .status')
          fi
          if [ "$status" = "amended" ]; then
            waiting=$(gh run list --workflow="Uplink submit" --status=waiting --json databaseId,displayTitle,name 2>/dev/null || echo '[]')
            echo "$waiting" | jq -r --arg id "$id" '.[] | select((.displayTitle // "" | contains($id)) or (.name // "" | contains($id))) | .databaseId' | while read -r run_id; do
              if [ -n "$run_id" ]; then
                gh run cancel "$run_id" || true
              fi
            done
            gh workflow run "Uplink submit" --ref main -f "patch_id=$id"
          fi

          close_url=$(jq -r '.gh.issueClose.url // empty' <<<"$resolve_json")
          close_comment=$(jq -r '.gh.issueClose.comment // empty' <<<"$resolve_json")
          if [ -n "$close_url" ]; then
            gh issue close "$close_url" --comment "$close_comment"
          else
            issue=$(gh issue list --state open --json number,title --jq ".[] | select(.title==\"Uplink conflict: ${id}\") | .number" | head -n 1)
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Resolved ${id}; company main rebuilt. Do not open a conflict PR."
            fi
          fi

          if [ "$code" -eq 2 ]; then
            conflict_id=$(jq -r '.conflict.id // empty' <<<"$resolve_json")
            conflict_branch=$(jq -r '.conflict.branch // empty' <<<"$resolve_json")
            if [ -z "$conflict_id" ] || [ "$conflict_id" = "null" ]; then
              echo "resolve exited 2 but no conflict patch was recorded"
            else
              if git show-ref --verify --quiet "refs/heads/${conflict_branch}"; then
                git push origin "refs/heads/${conflict_branch}:refs/heads/${conflict_branch}" --force
              fi

              title=$(jq -r '.gh.issueCreate.title' <<<"$resolve_json")
              body_file=$(jq -r '.gh.issueCreate.bodyFile' <<<"$resolve_json")
              existing=$(gh issue list --state open --json url,title --jq ".[] | select(.title==\"${title}\") | .url" | head -n 1)
              if [ -z "$existing" ]; then
                gh label create uplink:conflict --description "Uplink sync conflict; checkout the conflict branch, do not open a PR" --color B60205 || true
                url=$(gh issue create --title "$title" --label uplink:conflict --body-file "$body_file")
              else
                url="$existing"
              fi
              git uplink conflicted "$conflict_id" --issue-url "$url"
            fi
          fi

          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --comment "Resolved ${id}; company main rebuilt. Conflicts are tracked as issues, not PRs. Do not merge a conflict PR."
          fi
          git push origin --delete "$GITHUB_REF_NAME"
          exit "$code"
