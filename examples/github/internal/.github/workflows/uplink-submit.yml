# Example copy of templates/emu-workflows/uplink-submit.yml.
# Keep behavior in sync. This copy installs git-uplink on the runner.
#
# Default auth is a PAT in the oss Environment secret UPLINK_GITHUB_TOKEN
# (vars.UPLINK_SUBMIT_AUTH=pat). That works when the contrib fork is on a
# different GitHub owner than upstream. Set UPLINK_SUBMIT_AUTH=app and
# fill UPLINK_APP_* secrets to mint an installation token instead
# (production-shaped; both repos must share the App installation owner).
name: Uplink submit
run-name: Uplink submit ${{ inputs.patch_id }}

on:
  workflow_dispatch:
    inputs:
      patch_id:
        description: Patch id to export (upl_…)
        required: true

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  packet:
    name: Write OSS packet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-git-uplink
        with:
          src: ${{ vars.UPLINK_SRC }}
          rev: ${{ vars.UPLINK_REV }}
      - name: Configure uplink remotes
        run: git uplink init
      - name: Write approver packet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin '+refs/heads/uplink/state:refs/heads/uplink/state'
          git uplink report ${{ inputs.patch_id }}
          git push origin uplink/state

  submit:
    name: Approve oss environment and submit
    needs: packet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: oss
      url: ${{ github.server_url }}/${{ github.repository }}/blob/uplink/state/.uplink/reports/${{ inputs.patch_id }}/prepare.md
    concurrency:
      group: uplink-mutate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: ./.github/actions/install-git-uplink
        with:
          src: ${{ vars.UPLINK_SRC }}
          rev: ${{ vars.UPLINK_REV }}
      - name: Configure uplink remotes
        run: git uplink init
      - name: Mint GitHub App token for public github.com
        id: app
        if: ${{ vars.UPLINK_SUBMIT_AUTH == 'app' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPLINK_APP_ID }}
          private-key: ${{ secrets.UPLINK_APP_PRIVATE_KEY }}
          owner: ${{ secrets.UPLINK_UPSTREAM_OWNER }}
          repositories: ${{ secrets.UPLINK_CONTRIB_REPO }}
      - name: Record approval, export, and record the public PR
        env:
          UPLINK_GITHUB_TOKEN: ${{ vars.UPLINK_SUBMIT_AUTH == 'app' && steps.app.outputs.token || secrets.UPLINK_GITHUB_TOKEN }}
          GH_TOKEN: ${{ vars.UPLINK_SUBMIT_AUTH == 'app' && steps.app.outputs.token || secrets.UPLINK_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLINK_PREFLIGHT: ${{ vars.UPLINK_PREFLIGHT }}
          UPLINK_OSS_ENVIRONMENT: oss
        run: |
          git fetch origin '+refs/heads/uplink/state:refs/heads/uplink/state'
          git uplink approve ${{ inputs.patch_id }}
          submit_json=$(git uplink submit ${{ inputs.patch_id }})

          repo=$(jq -r '.gh.prCreate.repo // empty' <<<"$submit_json")
          head=$(jq -r '.gh.prCreate.head // empty' <<<"$submit_json")
          url=$(jq -r '.existingPr.url // empty' <<<"$submit_json")
          if [ -z "$url" ] && [ -n "$repo" ] && [ -n "$head" ]; then
            url=$(gh pr list -R "$repo" --head "$head" --state open --json url --jq '.[0].url')
          fi
          if [ -z "$url" ]; then
            url=$(gh pr create -R "$repo" \
              --head "$head" \
              --base "$(jq -r .gh.prCreate.base <<<"$submit_json")" \
              --title "$(jq -r .gh.prCreate.title <<<"$submit_json")" \
              --body-file "$(jq -r .gh.prCreate.bodyFile <<<"$submit_json")")
          fi
          env -u UPLINK_GITHUB_TOKEN git uplink submitted ${{ inputs.patch_id }} --pr-url "$url"
