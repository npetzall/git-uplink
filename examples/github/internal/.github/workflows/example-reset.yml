# Restore company main, uplink/state, and uplink/upstream from seed refs.
# Run from branch seed if main is wrecked.
name: Reset example

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: seed
      - name: Restore seed refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/reset-example.sh
