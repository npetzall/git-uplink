# Reset this public tokenkit repo: close PRs, drop leftover branches,
# force-push seed onto main. Run from branch seed if main is wrecked.
name: Reset example

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: seed
      - name: Restore main from seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/reset-example.sh
